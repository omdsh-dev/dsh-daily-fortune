<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 200" role="img" aria-hidden="true">
  <title>签枝</title>
  <desc>Single bamboo fortune stick with a cinnabar tip</desc>
  <defs>
    <linearGradient id="stickGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efdfb8"/>
      <stop offset="0.5" stop-color="#ddc793"/>
      <stop offset="1" stop-color="#c9b179"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8452f"/>
      <stop offset="1" stop-color="#b02a1e"/>
    </linearGradient>
  </defs>
  <!-- red tip -->
  <path d="M10.4 14 C10.4 9.6 11 6.8 12 5.4 C13 6.8 13.6 9.6 13.6 14 L13.6 34 L10.4 34 Z" fill="url(#redGrad)" stroke="#9c241a" stroke-width="0.9"/>
  <!-- body -->
  <path d="M10.4 34 L10.2 195 L13.8 195 L13.6 34 Z" fill="url(#stickGrad)" stroke="#7c6d49" stroke-width="0.9"/>
  <!-- bamboo nodes -->
  <path d="M10.3 72 C11.3 73.2 12.7 73.2 13.7 72" fill="none" stroke="#8a7a55" stroke-width="1"/>
  <path d="M10.2 128 C11.3 129.2 12.7 129.2 13.8 128" fill="none" stroke="#8a7a55" stroke-width="1"/>
  <!-- highlight -->
  <path d="M11 34 L11.2 195" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>
</svg>
